name: Sync API to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
          
      - uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          # Replace 'mobadara' with your HF username if different
          huggingface_repo_id: mobadara/finbert-sentiment-api 
          repo_type: space        # <-- Crucial change: this is a Space, not a Model!
          hf_token: ${{ secrets.HF_TOKEN }}
